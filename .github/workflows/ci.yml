name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DEEPSEEK_API_KEY: ""
          LARK_APP_ID: ""
          LARK_APP_SECRET: ""
          TOKEN_ENCRYPTION_KEY: ""
        run: python -m unittest discover -s tests -v

  offline-eval:
    name: Offline evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The secrets context is not allowed inside if: expressions (job or
      # step level), so the key gate happens in the shell: the step runs
      # always and exits early when the secret is not configured.
      - name: Run offline evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured; skipping offline evaluation"
            exit 0
          fi
          python evaluation/run_eval.py
